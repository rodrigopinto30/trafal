# Trafal · servicios propios. Supabase lo levanta su CLI oficial (también sobre Docker) y comparte su red.
# Se maneja con ./start.sh y ./stop.sh; no hace falta llamar a docker compose a mano.
name: trafal

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    image: trafal-web:dev
    # Corre con tu usuario: los archivos que genera (node_modules, .next) no quedan de root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    init: true
    environment:
      HOME: /tmp/home
      # Lo que ve el NAVEGADOR (localhost) y lo que ve el SERVIDOR dentro de Docker (nombre del contenedor de Supabase).
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_INTERNAL_URL: http://supabase_kong_trafal:8000
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      # Captcha de Cloudflare Turnstile (opcional en local). La clave del sitio es pública; la secreta la ve SOLO el servidor.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Almacenamiento de imágenes (S3 compatible: en producción, Cloudflare R2). Las credenciales las ve SOLO el servidor;
      # el navegador únicamente conoce la URL pública de lectura (NEXT_PUBLIC_MEDIA_URL).
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-media}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-quarantine}
      NEXT_PUBLIC_MEDIA_URL: ${MEDIA_PUBLIC_URL}
      NEXT_PUBLIC_GAMES_BASE_URL: ${GAMES_BASE_URL}
    # En Linux hay que declarar a mano cómo llegar al host (Docker Desktop ya lo trae): ahí está el puerto de Supabase.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [default, supabase]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 90
      start_period: 15s

  # Sirve los juegos publicados desde su propio dominio (<id>.games.localhost en local) con cabeceras de seguridad estrictas.
  # Es el único componente que lee el bucket privado de juegos; ver docs/ARQUITECTURA.md.
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    image: trafal-gateway:run
    restart: unless-stopped
    init: true
    environment:
      PORT: 4000
      GAMES_BASE_URL: ${GAMES_BASE_URL}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SUPABASE_URL: http://supabase_kong_trafal:8000
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_GAMES: ${S3_BUCKET_GAMES:-games}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GAMES_PORT:-4000}:4000"
    networks: [default, supabase]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/__health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Valida y publica los zips de juegos que sube la gente (ver docs/ARQUITECTURA.md). Habla con Postgres como el rol mínimo
  # `game_worker` (solo puede llamar a las funciones del esquema `worker`) y con el almacenamiento de objetos.
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: run
    image: trafal-worker:run
    restart: unless-stopped
    init: true
    environment:
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-quarantine}
      S3_BUCKET_GAMES: ${S3_BUCKET_GAMES:-games}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, supabase]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - worker-work:/work
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-m", "trafal_worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  worker-work:

networks:
  # La crea el CLI de Supabase al hacer `supabase start` (por eso start.sh levanta Supabase primero).
  supabase:
    name: supabase_network_trafal
    external: true
