packages:
  - apps/*
  - packages/*
  - e2e

# Store de pnpm dentro del repo (ignorado por git): mismo disco que node_modules → enlaces duros, sin copias.
storeDir: .pnpm-store

# pnpm 12 bloquea por defecto los scripts de instalación de las dependencias.
# Acá se aprueban explícitamente (solo lo estrictamente necesario).
allowBuilds:
  sharp: false
  unrs-resolver: false

# Cadena de suministro: una versión publicada hace menos de 7 días no se instala (da tiempo a que se detecte si era maliciosa),
# las dependencias de las dependencias solo vienen del registro (nada de git ni de URLs sueltas) y una actualización no puede bajar
# las garantías de procedencia que ya tenía un paquete.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Excepción revisada a mano (2026-11-19): esta versión, que trae eslint-config-next solo para desarrollo, se publicó sin la
# procedencia que tenían las anteriores. Vale solo para esa versión exacta: una nueva vuelve a pasar por la regla.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
