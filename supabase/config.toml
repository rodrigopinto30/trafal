# Trafal — Supabase local (CLI 3.x).
# Referencia: https://supabase.com/docs/guides/local-development/cli/config
#
# Este archivo solo configura el entorno LOCAL (lo levanta ./start.sh).
# La configuración de producción vive en el panel de Supabase; ver docs/DEPLOY.md.

project_id = "trafal"

[api]
enabled = true
port = 54321
# Solo `public`: no exponemos graphql_public. Las funciones auxiliares viven en `private`
# (no expuesto) y el trabajo del worker de subidas llegará por conexión directa a Postgres.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Deny-by-default: tablas y funciones nuevas NO son accesibles por la API hasta que una
# migración haga un GRANT explícito. Así un olvido falla en local, no en producción.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Servidor de correo de pruebas (Mailpit): ahí llegan los mails de confirmación en local.
[local_smtp]
enabled = true
port = 54324

# Imágenes de usuario (avatares y, más adelante, portadas/capturas/avances). En producción van a Cloudflare R2; en local
# usamos el endpoint S3 de Supabase Storage como emulador de R2 (la app habla S3 en los dos casos).
[storage]
enabled = true
file_size_limit = "200MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

# Bucket público de medios. Los tamaños y tipos finos (avatar ≤ 1 MB, WebP) los valida el servidor de la app.
[storage.buckets.media]
public = true
file_size_limit = "20MiB"
allowed_mime_types = ["image/webp", "image/png", "image/jpeg", "image/gif", "video/mp4", "video/webm"]

# Zips de juegos recién subidos, sin revisar. Privado: solo lo leen el worker y el servidor. En producción (R2) una regla de
# ciclo de vida los borra a las 24 h. Sin lista de tipos: el contenido lo valida el worker, no el navegador.
[storage.buckets.quarantine]
public = false
file_size_limit = "200MiB"

# Juegos ya validados y descomprimidos (games/{public_id}/v{n}/...). Privado: los lee solo el gateway. Sin lista de tipos
# (los juegos llevan .wasm, .js, .html...).
[storage.buckets.games]
public = false
file_size_limit = "500MiB"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
# Importante: el sitio corre en http://localhost:3000. Las rutas /auth/confirm y /auth/callback
# no llevan prefijo de idioma (ver apps/web/src/app/auth).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
# En local no queremos topes de mails por hora (en producción los define el SMTP propio).
email_sent = 1000
sign_in_sign_ups = 100
token_verifications = 100

[auth.email]
enabled = true
double_confirm_changes = true
# Confirmación obligatoria, igual que en producción (el mail llega a Mailpit: http://localhost:54324).
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Plantillas bilingües (es/en) con el estilo de Trafal. Usan el flujo token_hash, que funciona
# aunque el mail se abra en otro dispositivo (el flujo PKCE exige abrirlo en el mismo navegador).
[auth.email.template.confirmation]
subject = "Confirmá tu cuenta de Trafal · Confirm your Trafal account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recuperá tu contraseña de Trafal · Reset your Trafal password"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
# Solo funciona con credenciales reales (ver README → "Login con Google"). Sin ellas el botón
# queda oculto (NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false) y el login con email funciona igual.
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.sms]
enabled = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
